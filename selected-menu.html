<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Your Selected Menu | Baruch Caterers</title>
  <style>
    :root {
      --navy: #11185e;
      --blue: #2872d2;
      --gold: #b78b2d;
      --cream: #faf7ef;
      --line: #e8ddc2;
      --text: #26283b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #f3eee2, #fff 48%, #edf3fc);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
    }
    main {
      width: min(760px, calc(100% - 28px));
      margin: 32px auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 24px 70px rgba(17,24,94,.14);
    }
    header {
      padding: 30px clamp(22px, 6vw, 54px);
      background: var(--navy);
      color: #fff;
      text-align: center;
    }
    .brand {
      margin: 0 0 12px;
      color: #f2cf7c;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 400;
      line-height: 1.08;
    }
    .intro {
      margin: 12px 0 0;
      color: #dce4ff;
      line-height: 1.6;
    }
    #menu-content { padding: clamp(24px, 6vw, 48px); }
    .category {
      margin-bottom: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--cream);
    }
    .category:last-child { margin-bottom: 0; }
    h2 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: 1.25rem;
      font-weight: 400;
    }
    ul {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      position: relative;
      padding: 0 0 10px 24px;
      border-bottom: 1px solid #e7e0cf;
      line-height: 1.45;
    }
    li:last-child { padding-bottom: 0; border-bottom: 0; }
    li::before {
      position: absolute;
      top: .42em;
      left: 2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      content: "";
    }
    .total {
      margin: 24px 0 0;
      color: var(--navy);
      font-weight: 700;
      text-align: center;
    }
    .actions {
      display: grid;
      grid-template-columns: minmax(220px, 360px);
      justify-content: center;
      gap: 12px;
      padding: 0 clamp(24px, 6vw, 48px) clamp(28px, 6vw, 48px);
    }
    .button {
      display: flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--navy);
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .button.secondary { background: #fff; color: var(--navy); }
    .error {
      padding: 48px 24px;
      text-align: center;
      line-height: 1.6;
    }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      main { width: calc(100% - 18px); margin: 9px auto; border-radius: 20px; }
      header { padding: 25px 18px; }
      #menu-content { padding: 20px 14px; }
      .category { padding: 18px 16px; }
      .actions { grid-template-columns: 1fr; padding: 0 14px 24px; }
    }
    @media print {
      body { background: #fff; }
      main { width: 100%; margin: 0; border: 0; box-shadow: none; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">Baruch Caterers</p>
      <h1>Your Customised Menu</h1>
      <p class="intro">The food selections chosen for your celebration.</p>
    </header>
    <div id="menu-content" aria-live="polite"></div>
    <p id="menu-error" class="error" hidden>This selected menu link is incomplete or invalid. Please create a new selection from the Baruch Caterers menu page.</p>
    <div id="menu-actions" class="actions" hidden>
      <button class="button secondary" type="button" onclick="window.print()">Download / Print List</button>
    </div>
  </main>
  <script>
    (() => {
      const encoded = new URLSearchParams(location.search).get("menu");
      const content = document.querySelector("#menu-content");
      const error = document.querySelector("#menu-error");
      const actions = document.querySelector("#menu-actions");
      const showError = () => {
        content.hidden = true;
        error.hidden = false;
      };
      if (!encoded) {
        showError();
        return;
      }
      try {
        const base64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        const groups = JSON.parse(new TextDecoder().decode(bytes));
        if (!Array.isArray(groups) || !groups.length) throw new Error("Empty menu");
        let total = 0;
        const message = ["Hi Baruch Caterers,", "", "I would like a quotation for this customised menu:", ""];
        groups.forEach(([category, items]) => {
          if (typeof category !== "string" || !Array.isArray(items) || !items.length) return;
          const section = document.createElement("section");
          const heading = document.createElement("h2");
          const list = document.createElement("ul");
          section.className = "category";
          heading.textContent = category;
          message.push(category + ":");
          items.forEach((item) => {
            if (typeof item !== "string") return;
            const row = document.createElement("li");
            row.textContent = item;
            list.append(row);
            message.push("• " + item);
            total += 1;
          });
          message.push("");
          section.append(heading, list);
          content.append(section);
        });
        if (!total) throw new Error("Empty menu");
        const totalOutput = document.createElement("p");
        totalOutput.className = "total";
        totalOutput.textContent = total + " selected item" + (total === 1 ? "" : "s");
        content.append(totalOutput);
        message.push("Total selected items: " + total);
        actions.hidden = false;
      } catch {
        showError();
      }
    })();
  </script>
</body>
</html>
